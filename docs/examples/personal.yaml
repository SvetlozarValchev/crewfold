# Illustrative future configuration. No parser exists yet.
schema: crewfold.dev/workspace/v1alpha1
kind: Workspace

metadata:
  name: personal

spec:
  state:
    database: xdg://data/crewfold/crewfold.db

  limits:
    max_active_runs: 8
    max_starting_runs: 2
    max_active_runs_per_provider: 4

  runtimes:
    preferred: herdr
    configured:
      herdr:
        kind: herdr
        discover_api_schema: true
      direct:
        kind: direct

  projects:
    - name: world-engine
      repositories:
        - name: engine
          checkout: /home/example/depot/dev/world-engine
      additional_checkouts:
        - path: /home/example/depot/dev/world-engine-2
          write_policy: exclusive
        - path: /home/example/depot/dev/world-engine-3
          write_policy: exclusive
      checks:
        - name: unit
          command: ["go", "test", "./..."]
          timeout: 10m

  policy:
    default:
      allow:
        - coordination.read
        - coordination.message
        - task.report
      approval_required:
        - git.push
        - git.merge
        - external.message
      deny:
        - production.deploy
        - secret.read_value

  knowledge:
    retrieval:
      full_text: true
      embeddings: false
    context_budget:
      approximate_tokens: 12000
