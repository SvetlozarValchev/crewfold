version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/store/dbgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - column: "meetings.frozen_input_json"
            go_type: "string"
          - column: "meetings.allowed_actions_json"
            go_type: "string"
          - column: "meeting_contributions.evidence_json"
            go_type: "string"
          - column: "meeting_actions.payload_json"
            go_type: "string"
